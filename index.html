<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Low-Cost Stock Dashboard</title>

    <!-- Plotly.js Library -->
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0c10;
            color: #c5c6c7;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .dashboard-container {
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header {
            text-align: center;
            border-bottom: 2px solid #1f2833;
            padding-bottom: 15px;
        }

        header h1 {
            color: #66fcf1;
            font-size: 1.8rem;
            margin-bottom: 5px;
        }

        header p {
            color: #45a29e;
            font-size: 0.9rem;
        }

        .content-grid {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .content-grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background-color: #1f2833;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .card h2 {
            color: #66fcf1;
            font-size: 1.2rem;
            margin-bottom: 15px;
            border-bottom: 1px solid #45a29e;
            padding-bottom: 8px;
        }

        .ticker-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .ticker-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background-color: #0b0c10;
            border-radius: 6px;
            border-left: 4px solid #45a29e;
            transition: all 0.3s ease;
        }

        /* Glowing Gold Alert for $5–$10 target stocks */
        .ticker-row.target-alert {
            border-left: 4px solid #ffd700 !important;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.2);
            background-color: #161b22;
        }

        .badge {
            background-color: #ffd700;
            color: #0b0c10;
            font-size: 0.65rem;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 8px;
            display: inline-block;
        }

        .ticker-symbol {
            font-weight: bold;
            color: #ffffff;
        }

        .ticker-price {
            font-weight: 600;
        }

        #sunburstChart {
            width: 100%;
            height: 400px;
        }

        .status-bar {
            text-align: right;
            font-size: 0.8rem;
            color: #45a29e;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <header>
            <h1>Low-Cost Stock Tracker</h1>
            <p>Real-Time Tracking Engine ($5–$10 Focus)</p>
        </header>

        <div class="content-grid">
            <!-- Left Column: Sunburst Chart -->
            <div class="card">
                <h2>Portfolio Allocation</h2>
                <div id="sunburstChart"></div>
            </div>

            <!-- Right Column: Ticker List -->
            <div class="card">
                <h2>Watched Tickers</h2>
                <div id="ticker-list" class="ticker-list">
                    <p style="text-align: center; color: #888;">Connecting to local engine...</p>
                </div>
            </div>
        </div>

        <div class="status-bar" id="last-updated">
            Status: Initializing connection...
        </div>
    </div>

    <script>
        const API_URL = "http://127.0.0.1:8501/api/stocks";

        async function refreshDashboard() {
            try {
                const response = await fetch(API_URL);
                const result = await response.json();
                
                if (result.status === "success" && result.data) {
                    updateDashboardUI(result.data);
                    document.getElementById("last-updated").innerText = `Status: Live | Last synced: ${new Date().toLocaleTimeString()}`;
                    document.getElementById("last-updated").style.color = "#45a29e";
                }
            } catch (error) {
                console.error("Error connecting to FastAPI backend:", error);
                document.getElementById("last-updated").innerText = "Status: Backend Disconnected (Ensure main.py is running on port 8501)";
                document.getElementById("last-updated").style.color = "#ff4d4d";
            }
        }

        function updateDashboardUI(stocks) {
            // 1. Prepare Hierarchical Multi-Tier Sunburst Data
            const labels = ["Portfolio"];
            const parents = [""];
            const values = [null]; 

            // Extract unique sectors
            const uniqueSectors = [...new Set(stocks.map(s => s.sector))];
            
            // Add Sector Nodes (Level 1)
            uniqueSectors.forEach(sector => {
                labels.push(sector);
                parents.push("Portfolio");
                values.push(null); // Plotly sums children automatically
            });

            // Add Ticker Nodes (Level 2)
            stocks.forEach(stock => {
                labels.push(stock.symbol);
                parents.push(stock.sector); // Parent is the Sector!
                values.push(stock.price);
            });

            const sunburstData = [{
                type: "sunburst",
                labels: labels,
                parents: parents,
                values: values,
                outsidetextfont: { size: 12, color: "#ffffff" },
                leaf: { opacity: 0.8 },
                marker: { line: { width: 2, color: "#0b0c10" } }
            }];

            const layout = {
                margin: { l: 0, r: 0, b: 0, t: 0 },
                paper_bgcolor: "rgba(0,0,0,0)",
                plot_bgcolor: "rgba(0,0,0,0)",
                font: { color: "#c5c6c7" }
            };

            Plotly.newPlot('sunburstChart', sunburstData, layout, { responsive: true, displayModeBar: false });

            // 2. Render Ticker List Cards grouped by Sector
            const tickerContainer = document.getElementById("ticker-list");
            if (tickerContainer) {
                tickerContainer.innerHTML = stocks.map(stock => {
                    const isPositive = stock.change >= 0;
                    const changeColor = isPositive ? '#66fcf1' : '#ff4d4d';
                    const changeSign = isPositive ? '+' : '';

                    const alertClass = stock.target_hit ? 'target-alert' : '';
                    const badgeHtml = stock.target_hit ? '<span class="badge">TARGET $5-$10</span>' : '';

                    return `
                        <div class="ticker-row ${alertClass}">
                            <div>
                                <span class="ticker-symbol">${stock.symbol}</span>
                                <small style="color: #888; font-size: 0.75rem; margin-left: 4px;">(${stock.sector})</small>
                                ${badgeHtml}
                            </div>
                            <span class="ticker-price" style="color: ${changeColor};">
                                $${stock.price.toFixed(2)} (${changeSign}${stock.change}%)
                            </span>
                        </div>
                    `;
                }).join('');
            }
        }

        refreshDashboard();
        setInterval(refreshDashboard, 30000);
    </script>
</body>
</html>
