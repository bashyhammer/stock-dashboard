<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Paper Trading & Stock Dashboard</title>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
        :root {
            --bg-dark: #121212;
            --card-dark: #1e1e1e;
            --text-main: #e0e0e0;
            --accent-green: #00e676;
            --accent-red: #ff5252;
            --border-color: #333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        h1 { margin: 0; font-size: 1.5rem; }

        /* Portfolio Bar */
        .portfolio-card {
            background-color: var(--card-dark);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            text-align: center;
        }

        .portfolio-stat {
            display: flex;
            flex-direction: column;
        }

        .portfolio-stat .label { font-size: 0.85rem; color: #888; margin-bottom: 5px; }
        .portfolio-stat .val { font-size: 1.25rem; font-weight: bold; }

        /* Controls & Search */
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            background: var(--card-dark);
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 10px;
            border-radius: 6px;
            flex-grow: 1;
        }

        button {
            background-color: #333;
            color: #fff;
            border: 1px solid var(--border-color);
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover { background-color: #444; }
        button.btn-buy { background-color: rgba(0, 230, 118, 0.2); color: var(--accent-green); border-color: var(--accent-green); }
        button.btn-sell { background-color: rgba(255, 82, 82, 0.2); color: var(--accent-red); border-color: var(--accent-red); }
        button.btn-buy:hover { background-color: var(--accent-green); color: #000; }
        button.btn-sell:hover { background-color: var(--accent-red); color: #fff; }

        /* Stock Table */
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: var(--card-dark);
            border-radius: 8px;
            overflow: hidden;
            margin-top: 10px;
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        th { background-color: #252525; color: #aaa; font-weight: 600; }

        .green { color: var(--accent-green); }
        .red { color: var(--accent-red); }

        .action-btns {
            display: flex;
            gap: 5px;
        }

        .action-btns button {
            padding: 4px 8px;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>AI Stock Dashboard & Paper Trader</h1>
        <button onclick="exportToCSV()">Export CSV</button>
    </header>

    <!-- VIRTUAL PORTFOLIO BANNER -->
    <div class="portfolio-card">
        <div class="portfolio-stat">
            <span class="label">Virtual Cash</span>
            <span class="val green" id="portfolio-cash">$10,000.00</span>
        </div>
        <div class="portfolio-stat">
            <span class="label">Active Holdings</span>
            <span class="val" id="portfolio-holdings-count">0 Positions</span>
        </div>
        <div class="portfolio-stat">
            <span class="label">Total Account Equity</span>
            <span class="val" id="portfolio-total-equity">$10,000.00</span>
        </div>
    </div>

    <!-- CONTROLS -->
    <div class="controls">
        <input type="text" id="ticker-input" placeholder="Enter Ticker (e.g. AAPL, NVDA)...">
        <button onclick="addTicker()">Add Ticker</button>
        <button onclick="fetchDashboardData()">Force Refresh</button>
    </div>

    <!-- STOCKS TABLE -->
    <table>
        <thead>
            <tr>
                <th>Symbol</th>
                <th>Sector</th>
                <th>Price ($)</th>
                <th>Change (%)</th>
                <th>Target Hit</th>
                <th>Owned Shares</th>
                <th>Quick Trade</th>
            </tr>
        </thead>
        <tbody id="stock-table-body">
            <tr><td colspan="7" style="text-align:center;">Loading market data...</td></tr>
        </tbody>
    </table>
</div>

<script>
    // Adjust API_BASE to match local vs production endpoint automatically
    const API_BASE = window.location.hostname === "127.0.0.1" || window.location.hostname === "localhost"
        ? "http://127.0.0.1:8501"
        : "https://my-stock-tracker-api.onrender.com";

    let currentlyDisplayedStocks = [];
    let currentPortfolio = { cash: 10000, holdings: {} };

    async function fetchPortfolio() {
        try {
            const res = await fetch(`${API_BASE}/portfolio`);
            if (res.ok) {
                currentPortfolio = await res.json();
                updatePortfolioUI();
            }
        } catch (err) {
            console.error("Error fetching portfolio:", err);
        }
    }

    function updatePortfolioUI() {
        document.getElementById("portfolio-cash").innerText = `$${currentPortfolio.cash.toFixed(2)}`;
        
        const holdingsKeys = Object.keys(currentPortfolio.holdings || {});
        document.getElementById("portfolio-holdings-count").innerText = `${holdingsKeys.length} Positions`;

        // Calculate total equity (cash + position values)
        let holdingsValue = 0;
        holdingsKeys.forEach(symbol => {
            const holding = currentPortfolio.holdings[symbol];
            const stock = currentlyDisplayedStocks.find(s => s.symbol === symbol);
            const currentPrice = stock ? stock.price : holding.avg_price;
            holdingsValue += holding.shares * currentPrice;
        });

        const totalEquity = currentPortfolio.cash + holdingsValue;
        document.getElementById("portfolio-total-equity").innerText = `$${totalEquity.toFixed(2)}`;
    }

    async function fetchDashboardData() {
        try {
            const res = await fetch(`${API_BASE}/stocks`);
            if (res.ok) {
                currentlyDisplayedStocks = await res.json();
                await fetchPortfolio();
                renderTable();
            }
        } catch (err) {
            console.error("Error fetching stock data:", err);
        }
    }

    function renderTable() {
        const tbody = document.getElementById("stock-table-body");
        tbody.innerHTML = "";

        currentlyDisplayedStocks.forEach(s => {
            const isGreen = s.change >= 0;
            const changeClass = isGreen ? "green" : "red";
            const changeSign = isGreen ? "+" : "";
            const owned = currentPortfolio.holdings[s.symbol] ? currentPortfolio.holdings[s.symbol].shares : 0;

            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td><strong>${s.symbol}</strong></td>
                <td>${s.sector}</td>
                <td>$${s.price.toFixed(2)}</td>
                <td class="${changeClass}">${changeSign}${s.change.toFixed(2)}%</td>
                <td>${s.target_hit ? '<span class="green">YES</span>' : 'NO'}</td>
                <td><strong>${owned}</strong></td>
                <td class="action-btns">
                    <button class="btn-buy" onclick="executeTrade('${s.symbol}', 'buy')">Buy 10</button>
                    <button class="btn-sell" onclick="executeTrade('${s.symbol}', 'sell')">Sell 10</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    async function executeTrade(symbol, type) {
        try {
            const endpoint = `${API_BASE}/${type}`;
            const response = await fetch(endpoint, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ ticker: symbol, shares: 10 })
            });

            const data = await response.json();
            if (!response.ok) {
                alert(data.detail || "Trade failed");
                return;
            }

            alert(data.message);
            await fetchDashboardData();
        } catch (err) {
            alert("Error connecting to trading server.");
        }
    }

    function exportToCSV() {
        if (!currentlyDisplayedStocks || currentlyDisplayedStocks.length === 0) {
            alert("No data available to export.");
            return;
        }

        const headers = ["Symbol", "Sector", "Price", "Change Percent", "Target Hit", "Owned Shares"];
        const csvRows = [
            headers.map(h => `"${h}"`).join(","),
            ...currentlyDisplayedStocks.map(s => {
                const owned = currentPortfolio.holdings[s.symbol] ? currentPortfolio.holdings[s.symbol].shares : 0;
                return [
                    `"${s.symbol}"`,
                    `"${s.sector}"`,
                    `"${s.price.toFixed(2)}"`,
                    `"${s.change.toFixed(2)}"`,
                    `"${s.target_hit ? "YES" : "NO"}"`,
                    `"${owned}"`
                ].join(",");
            })
        ];

        const csvString = "\uFEFF" + csvRows.join("\r\n");
        const blob = new Blob([csvString], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.setAttribute("href", url);
        link.setAttribute("download", `paper_portfolio_${new Date().toISOString().slice(0, 10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
    }

    // Initial Load
    fetchDashboardData();
</script>
</body>
</html>
