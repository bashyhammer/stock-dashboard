<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Stock Dashboard & Paper Trader</title>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
        :root {
            --bg-dark: #121212;
            --card-dark: #1e1e1e;
            --text-main: #e0e0e0;
            --accent-green: #00e676;
            --accent-red: #ff5252;
            --border-color: #333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        .container { max-width: 1200px; margin: 0 auto; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        h1 { margin: 0; font-size: 1.5rem; }

        .timer-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .svg-ring { transform: rotate(-90deg); }
        .ring-bg { stroke: #333; fill: none; stroke-width: 3; }
        .ring-progress { stroke: var(--accent-green); fill: none; stroke-width: 3; stroke-dasharray: 88; stroke-dashoffset: 0; transition: stroke-dashoffset 1s linear; }

        /* Portfolio Card */
        .portfolio-card {
            background-color: var(--card-dark);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            text-align: center;
        }

        .portfolio-stat { display: flex; flex-direction: column; }
        .portfolio-stat .label { font-size: 0.85rem; color: #888; margin-bottom: 5px; }
        .portfolio-stat .val { font-size: 1.25rem; font-weight: bold; }

        /* KPI Cards */
        .kpi-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .kpi-card {
            background-color: var(--card-dark);
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 8px;
        }

        .kpi-title { font-size: 0.8rem; color: #888; text-transform: uppercase; }
        .kpi-value { font-size: 1.3rem; font-weight: bold; margin-top: 5px; }

        /* Controls */
        .controls { display: flex; gap: 10px; margin-bottom: 20px; }

        input[type="text"] {
            background: var(--card-dark);
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 10px;
            border-radius: 6px;
            flex-grow: 1;
        }

        button {
            background-color: #333;
            color: #fff;
            border: 1px solid var(--border-color);
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover { background-color: #444; }
        button.btn-buy { background-color: rgba(0, 230, 118, 0.2); color: var(--accent-green); border-color: var(--accent-green); }
        button.btn-sell { background-color: rgba(255, 82, 82, 0.2); color: var(--accent-red); border-color: var(--accent-red); }

        /* Heatmap */
        #chart-container {
            background-color: var(--card-dark);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            min-height: 300px;
        }

        /* Table */
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: var(--card-dark);
            border-radius: 8px;
            overflow: hidden;
        }

        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid var(--border-color); }
        th { background-color: #252525; color: #aaa; }
        tr:hover { background-color: #2a2a2a; cursor: pointer; }

        .green { color: var(--accent-green); }
        .red { color: var(--accent-red); }
        .action-btns { display: flex; gap: 5px; }
        .action-btns button { padding: 4px 8px; font-size: 0.8rem; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>AI Stock Dashboard & Paper Trader</h1>
        <div class="timer-container">
            <svg class="svg-ring" width="32" height="32">
                <circle class="ring-bg" cx="16" cy="16" r="14"></circle>
                <circle id="timer-progress" class="ring-progress" cx="16" cy="16" r="14"></circle>
            </svg>
            <button id="pause-btn" onclick="togglePause()">Pause</button>
            <button onclick="exportToCSV()">Export CSV</button>
        </div>
    </header>

    <!-- PORTFOLIO CARD -->
    <div class="portfolio-card">
        <div class="portfolio-stat">
            <span class="label">Virtual Cash</span>
            <span class="val green" id="portfolio-cash">$10,000.00</span>
        </div>
        <div class="portfolio-stat">
            <span class="label">Active Holdings</span>
            <span class="val" id="portfolio-holdings-count">0 Positions</span>
        </div>
        <div class="portfolio-stat">
            <span class="label">Total Equity</span>
            <span class="val" id="portfolio-total-equity">$10,000.00</span>
        </div>
    </div>

    <!-- KPI STRIP -->
    <div class="kpi-container">
        <div class="kpi-card"><div class="kpi-title">Total Watched</div><div class="kpi-value" id="kpi-total">--</div></div>
        <div class="kpi-card"><div class="kpi-title">Target Hits ($5-$10)</div><div class="kpi-value green" id="kpi-hits">--</div></div>
        <div class="kpi-card"><div class="kpi-title">Top Gainer</div><div class="kpi-value green" id="kpi-gainer">--</div></div>
        <div class="kpi-card"><div class="kpi-title">Top Loser</div><div class="kpi-value red" id="kpi-loser">--</div></div>
    </div>

    <!-- HEATMAP -->
    <div id="chart-container"></div>

    <!-- CONTROLS -->
    <div class="controls">
        <input type="text" id="ticker-input" placeholder="Enter Ticker (e.g. AAPL, NVDA)...">
        <button onclick="addTicker()">Add Ticker</button>
        <button onclick="fetchDashboardData()">Force Refresh</button>
    </div>

    <!-- TABLE -->
    <table>
        <thead>
            <tr>
                <th>Symbol</th>
                <th>Sector</th>
                <th>Price ($)</th>
                <th>Change (%)</th>
                <th>Target Hit</th>
                <th>Owned Shares</th>
                <th>Quick Trade</th>
            </tr>
        </thead>
        <tbody id="stock-table-body">
            <tr><td colspan="7" style="text-align:center;">Fetching live stock data...</td></tr>
        </tbody>
    </table>
</div>

<script>
    const API_BASE = window.location.hostname === "127.0.0.1" || window.location.hostname === "localhost"
        ? "http://127.0.0.1:8501"
        : "https://my-stock-tracker-api.onrender.com";

    let currentlyDisplayedStocks = [];
    let currentPortfolio = { cash: 10000, holdings: {} };
    let countdown = 30;
    let isPaused = false;
    let timerInterval = null;

    function startTimer() {
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            if (!isPaused) {
                countdown--;
                const circle = document.getElementById("timer-progress");
                if (circle) circle.style.strokeDashoffset = 88 - (countdown / 30) * 88;

                if (countdown <= 0) {
                    countdown = 30;
                    fetchDashboardData();
                }
            }
        }, 1000);
    }

    function togglePause() {
        isPaused = !isPaused;
        document.getElementById("pause-btn").innerText = isPaused ? "Resume" : "Pause";
    }

    async function fetchPortfolio() {
        try {
            const res = await fetch(`${API_BASE}/portfolio`);
            if (res.ok) {
                currentPortfolio = await res.json();
                updatePortfolioUI();
            }
        } catch (err) {
            console.error("Error fetching portfolio:", err);
        }
    }

    function updatePortfolioUI() {
        document.getElementById("portfolio-cash").innerText = `$${currentPortfolio.cash.toFixed(2)}`;
        const keys = Object.keys(currentPortfolio.holdings || {});
        document.getElementById("portfolio-holdings-count").innerText = `${keys.length} Positions`;

        let holdingsVal = 0;
        keys.forEach(s => {
            const holding = currentPortfolio.holdings[s];
            const stock = currentlyDisplayedStocks.find(st => st.symbol === s);
            const price = (stock && stock.price > 0) ? stock.price : holding.avg_price;
            holdingsVal += holding.shares * price;
        });

        document.getElementById("portfolio-total-equity").innerText = `$${(currentPortfolio.cash + holdingsVal).toFixed(2)}`;
    }

    async function fetchDashboardData() {
        try {
            const res = await fetch(`${API_BASE}/stocks`);
            if (res.ok) {
                currentlyDisplayedStocks = await res.json();
                await fetchPortfolio();
                updateKPIs();
                renderHeatmap();
                renderTable();
            }
        } catch (err) {
            console.error("Error fetching dashboard data:", err);
        }
    }

    function updateKPIs() {
        if (!currentlyDisplayedStocks.length) return;
        document.getElementById("kpi-total").innerText = currentlyDisplayedStocks.length;
        const hits = currentlyDisplayedStocks.filter(s => s.target_hit).length;
        document.getElementById("kpi-hits").innerText = hits;

        const sorted = [...currentlyDisplayedStocks].sort((a, b) => b.change - a.change);
        document.getElementById("kpi-gainer").innerText = `${sorted[0].symbol} (${sorted[0].change > 0 ? '+' : ''}${sorted[0].change}%)`;
        document.getElementById("kpi-loser").innerText = `${sorted[sorted.length - 1].symbol} (${sorted[sorted.length - 1].change > 0 ? '+' : ''}${sorted[sorted.length - 1].change}%)`;
    }

    function renderHeatmap() {
    const validStocks = currentlyDisplayedStocks.filter(s => s.price > 0);
    if (!validStocks.length) return;

    const sectors = [...new Set(validStocks.map(s => s.sector))];
    
    // Construct hierarchy
    const labels = ["Sectors", ...sectors, ...validStocks.map(s => s.symbol)];
    const parents = ["", ...sectors.map(() => "Sectors"), ...validStocks.map(s => s.sector)];
    
    // Use market cap or price for slice sizing
    const values = [0, ...sectors.map(() => 0), ...validStocks.map(s => s.price)];
    
    // Sector average performance for inner ring colors
    const sectorChanges = sectors.map(sec => {
        const secStocks = validStocks.filter(s => s.sector === sec);
        const avg = secStocks.reduce((acc, curr) => acc + curr.change, 0) / secStocks.length;
        return avg;
    });

    // Color values array: Root (0), Sectors (avg change), Individual Stocks (% change)
    const colorVals = [0, ...sectorChanges, ...validStocks.map(s => s.change)];

    const data = [{
        type: "sunburst",
        labels: labels,
        parents: parents,
        values: values,
        marker: {
            colors: colorVals,
            colorscale: [
                [0.0, "#ff5252"],   // Deep Red for losses (-3% or worse)
                [0.5, "#444444"],   // Neutral Grey for 0%
                [1.0, "#00e676"]    // Deep Green for gains (+3% or better)
            ],
            cmin: -3,
            cmax: 3,
            cmid: 0,
            showscale: false
        },
        hoverinfo: "label+value",
        textfont: { color: "#ffffff" }
    }];

    const layout = {
        margin: { l: 10, r: 10, b: 10, t: 10 },
        paper_bgcolor: "#1e1e1e",
        plot_bgcolor: "#1e1e1e",
        font: { color: "#e0e0e0" }
    };

    Plotly.newPlot("chart-container", data, layout, { responsive: true, displayModeBar: false });
}

    function renderTable() {
        const tbody = document.getElementById("stock-table-body");
        tbody.innerHTML = "";

        currentlyDisplayedStocks.forEach(s => {
            const isGreen = s.change >= 0;
            const changeClass = isGreen ? "green" : "red";
            const changeSign = isGreen ? "+" : "";
            const owned = currentPortfolio.holdings[s.symbol] ? currentPortfolio.holdings[s.symbol].shares : 0;

            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td><strong>${s.symbol}</strong></td>
                <td>${s.sector}</td>
                <td>$${s.price ? s.price.toFixed(2) : "0.00"}</td>
                <td class="${changeClass}">${changeSign}${s.change ? s.change.toFixed(2) : "0.00"}%</td>
                <td>${s.target_hit ? '<span class="green">YES</span>' : 'NO'}</td>
                <td><strong>${owned}</strong></td>
                <td class="action-btns" onclick="event.stopPropagation()">
                    <button class="btn-buy" onclick="executeTrade('${s.symbol}', 'buy')">Buy 10</button>
                    <button class="btn-sell" onclick="executeTrade('${s.symbol}', 'sell')">Sell 10</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    async function executeTrade(symbol, type) {
        try {
            const response = await fetch(`${API_BASE}/${type}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ ticker: symbol, shares: 10 })
            });
            const data = await response.json();
            if (!response.ok) {
                alert(data.detail || "Trade failed");
                return;
            }
            alert(data.message);
            await fetchDashboardData();
        } catch (err) {
            alert("Error connecting to trading server.");
        }
    }

    async function addTicker() {
        const input = document.getElementById("ticker-input");
        const symbol = input.value.trim().toUpperCase();
        if (!symbol) return;

        const currentSymbols = currentlyDisplayedStocks.map(s => s.symbol);
        if (currentSymbols.includes(symbol)) {
            alert("Ticker already exists!");
            return;
        }

        currentSymbols.push(symbol);
        input.value = "";

        try {
            const res = await fetch(`${API_BASE}/stocks?tickers=${currentSymbols.join(",")}`);
            if (res.ok) {
                currentlyDisplayedStocks = await res.json();
                renderTable();
                renderHeatmap();
                updateKPIs();
            }
        } catch (err) {
            alert("Failed to add ticker.");
        }
    }

    function exportToCSV() {
        if (!currentlyDisplayedStocks || currentlyDisplayedStocks.length === 0) {
            alert("No data available to export.");
            return;
        }

        const headers = ["Symbol", "Sector", "Price", "Change Percent", "Target Hit", "Owned Shares"];
        const csvRows = [
            headers.map(h => `"${h}"`).join(","),
            ...currentlyDisplayedStocks.map(s => {
                const owned = currentPortfolio.holdings[s.symbol] ? currentPortfolio.holdings[s.symbol].shares : 0;
                return [
                    `"${s.symbol}"`,
                    `"${s.sector}"`,
                    `"${s.price.toFixed(2)}"`,
                    `"${s.change.toFixed(2)}"`,
                    `"${s.target_hit ? "YES" : "NO"}"`,
                    `"${owned}"`
                ].join(",");
            })
        ];

        const csvString = "\uFEFF" + csvRows.join("\r\n");
        const blob = new Blob([csvString], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.setAttribute("href", url);
        link.setAttribute("download", `paper_portfolio_${new Date().toISOString().slice(0, 10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
    }

    // Init
    fetchDashboardData();
    startTimer();
</script>
</body>
</html>
