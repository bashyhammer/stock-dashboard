<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Low-Cost Stock Dashboard</title>
    <link rel="stylesheet" href="style.css">

    <!-- Include Plotly.js -->
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
   
</head>
<body>

    <div class="dashboard-container">
        <header>
            <h1>Low-Cost Stock Tracker</h1>
            <p>Real-Time Tracking Engine ($5–$10 Focus)</p>
        </header>

        <!-- KPI Summary Strip -->
        <div class="kpi-bar">
            <div class="kpi-card">
                <h3>Total Tracked</h3>
                <div class="kpi-value" id="kpi-total">--</div>
            </div>
            <div class="kpi-card target">
                <h3>Target ($5–$10) Hits</h3>
                <div class="kpi-value" id="kpi-targets" style="color: #ffd700;">--</div>
            </div>
            <div class="kpi-card gainer">
                <h3>Top Gainer</h3>
                <div class="kpi-value" id="kpi-gainer" style="color: #00c853;">--</div>
            </div>
            <div class="kpi-card loser">
                <h3>Top Loser</h3>
                <div class="kpi-value" id="kpi-loser" style="color: #d32f2f;">--</div>
            </div>
        </div>

        <div class="content-grid">
            <!-- Left Column: Heatmap Sunburst Chart -->
            <div class="card">
                <div class="card-header">
                    <h2>Portfolio Allocation Heatmap</h2>
                </div>
                <div id="sunburstChart"></div>
            </div>

            <!-- Right Column: Ticker List Card -->
            <div class="card">
                <div class="card-header">
                    <h2>Watched Tickers</h2>
                    <label class="toggle-label">
                        <input type="checkbox" id="targetFilterToggle" onchange="handleFilterToggle()" style="cursor: pointer; accent-color: #ffd700;">
                        Target ($5–$10) Only
                    </label>
                </div>
                <div id="ticker-list" class="ticker-list">
                    <p style="text-align: center; color: #888;">Connecting to local engine...</p>
                </div>
            </div>
        </div>

        <div class="status-bar" id="last-updated">
            Status: Initializing connection...
        </div>
    </div>

    <script>
        const API_URL = "http://127.0.0.1:8501/api/stocks";
        let rawStockData = [];

        async function refreshDashboard() {
            try {
                const response = await fetch(API_URL);
                const result = await response.json();
                
                if (result.status === "success" && result.data) {
                    rawStockData = result.data;
                    applyFiltersAndRender();
                    document.getElementById("last-updated").innerText = `Status: Live | Last synced: ${new Date().toLocaleTimeString()}`;
                    document.getElementById("last-updated").style.color = "#45a29e";
                }
            } catch (error) {
                console.error("Error connecting to FastAPI backend:", error);
                document.getElementById("last-updated").innerText = "Status: Backend Disconnected (Ensure main.py is running on port 8501)";
                document.getElementById("last-updated").style.color = "#ff4d4d";
            }
        }

        function handleFilterToggle() {
            applyFiltersAndRender();
        }

        function applyFiltersAndRender() {
            const showTargetOnly = document.getElementById("targetFilterToggle").checked;
            
            const filteredStocks = showTargetOnly 
                ? rawStockData.filter(stock => stock.target_hit)
                : rawStockData;

            updateDashboardUI(filteredStocks);
            updateKPIs(rawStockData);
        }

        function updateKPIs(allStocks) {
            if (!allStocks || allStocks.length === 0) return;

            document.getElementById("kpi-total").innerText = allStocks.length;

            const targetHits = allStocks.filter(s => s.target_hit).length;
            document.getElementById("kpi-targets").innerText = targetHits;

            const sortedByPerformance = [...allStocks].sort((a, b) => b.change - a.change);
            const topGainer = sortedByPerformance[0];
            const topLoser = sortedByPerformance[sortedByPerformance.length - 1];

            if (topGainer) {
                document.getElementById("kpi-gainer").innerText = `${topGainer.symbol} (+${topGainer.change}%)`;
            }

            if (topLoser) {
                document.getElementById("kpi-loser").innerText = `${topLoser.symbol} (${topLoser.change}%)`;
            }
        }

        function getPerformanceColor(pctChange) {
            if (pctChange > 3) return "#00c853";
            if (pctChange > 0) return "#4caf50";
            if (pctChange === 0) return "#78909c";
            if (pctChange > -3) return "#e57373";
            return "#d32f2f";
        }

        function updateDashboardUI(stocks) {
            const tickerContainer = document.getElementById("ticker-list");

            if (!stocks || stocks.length === 0) {
                tickerContainer.innerHTML = '<p style="text-align: center; color: #888; padding: 20px;">No stocks match the target criteria.</p>';
                Plotly.purge('sunburstChart');
                return;
            }

            const sectorData = {};
            stocks.forEach(stock => {
                if (!sectorData[stock.sector]) {
                    sectorData[stock.sector] = { totalPrice: 0, totalChange: 0, count: 0 };
                }
                sectorData[stock.sector].totalPrice += stock.price;
                sectorData[stock.sector].totalChange += stock.change;
                sectorData[stock.sector].count += 1;
            });

            const ids = [];
            const labels = [];
            const parents = [];
            const values = [];
            const colors = [];

            Object.keys(sectorData).forEach(sector => {
                const avgChange = sectorData[sector].totalChange / sectorData[sector].count;
                ids.push(sector);
                labels.push(sector);
                parents.push("");
                values.push(sectorData[sector].totalPrice);
                colors.push(getPerformanceColor(avgChange));
            });

            stocks.forEach(stock => {
                ids.push(`${stock.sector}-${stock.symbol}`);
                labels.push(`${stock.symbol}<br>${stock.change >= 0 ? '+' : ''}${stock.change}%`);
                parents.push(stock.sector);
                values.push(stock.price);
                colors.push(getPerformanceColor(stock.change));
            });

            const sunburstData = [{
                type: "sunburst",
                ids: ids,
                labels: labels,
                parents: parents,
                values: values,
                branchvalues: "total",
                outsidetextfont: { size: 12, color: "#ffffff" },
                leaf: { opacity: 0.9 },
                marker: { 
                    colors: colors,
                    line: { width: 2, color: "#0b0c10" } 
                }
            }];

            const layout = {
                margin: { l: 0, r: 0, b: 0, t: 0 },
                paper_bgcolor: "rgba(0,0,0,0)",
                plot_bgcolor: "rgba(0,0,0,0)",
                font: { color: "#c5c6c7" }
            };

            Plotly.newPlot('sunburstChart', sunburstData, layout, { responsive: true, displayModeBar: false });

            // Render Ticker Cards with Hover Popups
            tickerContainer.innerHTML = stocks.map(stock => {
                const isPositive = stock.change >= 0;
                const changeColor = isPositive ? '#66fcf1' : '#ff4d4d';
                const changeSign = isPositive ? '+' : '';

                const alertClass = stock.target_hit ? 'target-alert' : '';
                const badgeHtml = stock.target_hit ? '<span class="badge">TARGET $5-$10</span>' : '';

                return `
                    <div class="ticker-row ${alertClass}">
                        <div>
                            <span class="ticker-symbol">${stock.symbol}</span>
                            <small style="color: #888; font-size: 0.75rem; margin-left: 4px;">(${stock.sector})</small>
                            ${badgeHtml}
                        </div>
                        <span class="ticker-price" style="color: ${changeColor};">
                            $${stock.price.toFixed(2)} (${changeSign}${stock.change}%)
                        </span>

                        <!-- Hover Card Pop-up -->
                        <div class="stock-hover-card">
                            <h4>${stock.symbol} Details</h4>
                            <p><strong>Sector:</strong> ${stock.sector}</p>
                            <p><strong>Price:</strong> $${stock.price.toFixed(2)}</p>
                            <p><strong>Daily Change:</strong> ${changeSign}${stock.change}%</p>
                            <p><strong>Target Range:</strong> ${stock.target_hit ? 'YES ($5–$10)' : 'NO'}</p>
                        </div>
                    </div>
                `;
            }).join('');
        }

        refreshDashboard();
        setInterval(refreshDashboard, 30000);
    </script>
</body>
</html>
