name: Keep Render Backend Alive

on:
  schedule:
    # Runs every 5 minutes, 24/7
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual trigger if needed

jobs:
  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          curl -s https://my-stock-tracker-api.onrender.com/
